# hostapd config for the controlled AP used to capture Google Home OTA traffic.
# Rename/symlink to /etc/hostapd/hostapd.conf or pass with -c.
# Run on the Pi's second Wi-Fi interface (wlan1) while wlan0/eth0 provides internet.

interface=wlan1
driver=nl80211

ssid=HomeNet                 # must match your router's SSID if you want the Mini to
                             # auto-connect; otherwise provision it on this network
wpa_passphrase=CHANGEME      # your WPA2 password

hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP

# Allow Google Home to connect (no MAC filter)
ignore_broadcast_ssid=0
